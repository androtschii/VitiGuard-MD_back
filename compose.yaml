name: vitiguard

# Общие настройки API и воркера: один образ, одни и те же адреса базы и Redis
x-app-environment: &app-environment
  VITIGUARD_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vitiguard}:${POSTGRES_PASSWORD:-vitiguard}@db:5432/${POSTGRES_DB:-vitiguard}
  VITIGUARD_CELERY_BROKER_URL: redis://redis:6379/0
  VITIGUARD_CELERY_RESULT_BACKEND: redis://redis:6379/1
  VITIGUARD_SMTP_HOST: mailpit
  VITIGUARD_SMTP_PORT: 1025
  VITIGUARD_S3_ENDPOINT: storage:9000
  VITIGUARD_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-vitiguard}
  VITIGUARD_S3_SECRET_KEY: ${S3_SECRET_KEY:-vitiguard-secret}

services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/info', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
      start_interval: 1s

  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      start_interval: 2s

  # Планировщик: ставит задачи по расписанию (пересчёт риска), выполняет их
  # воркер. Состояние расписания — во временном файле: после перезапуска отсчёт
  # начинается заново, и пропущенный пересчёт просто случится чуть позже
  beat:
    build: .
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy

  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vitiguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vitiguard}
      POSTGRES_DB: ${POSTGRES_DB:-vitiguard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/db/10_postgis.sh:/docker-entrypoint-initdb.d/10_postgis.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-совместимое хранилище фото листов (pr-039). RustFS, а не MinIO: образы
  # MinIO больше не публикуются на Docker Hub
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-vitiguard}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-vitiguard-secret}
    ports:
      - "${S3_PORT:-9000}:9000"
    volumes:
      - s3data:/data

  redis:
    image: redis:8-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # Почтовый сервер для разработки: письма не уходят наружу, а видны в
  # веб-интерфейсе на http://127.0.0.1:8025
  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgdata:
  redisdata:
  s3data:
