name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Линтеры и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github .
      - run: uv run black --check .
      - run: uv run mypy

  test:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv sync --locked
      - run: uv run pytest --cov

  ml:
    name: ML
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: ml
      - run: uv sync --locked
      - run: uv run mypy
      # Albumentations из группы train нужен только тестам аугментаций, PyTorch не ставится
      - run: uv run --with albumentations pytest

  docker:
    name: Сборка Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --build --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/info
      - name: Миграции применены
        run: |
          docker compose exec -T db psql -U vitiguard -d vitiguard -tAc "SELECT version_num FROM alembic_version" | grep .
          docker compose exec -T db psql -U vitiguard -d vitiguard -tAc "SELECT extversion FROM pg_extension WHERE extname = 'postgis'" | grep .
      - name: Воркер Celery выполняет задачи
        run: docker compose exec -T api python -c "from app.worker.celery_app import celery_app; print(celery_app.send_task('system.ping').get(timeout=15))" | grep pong
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
