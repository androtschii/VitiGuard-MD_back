[project]
name = "vitiguard-ml"
version = "0.1.0"
description = "Обучение и оценка моделей VitiGuard MD: диагностика по фото, прогноз риска, спутниковые аномалии"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=12.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0",
]
# Тяжёлые зависимости для обучения ставятся отдельно: uv sync --group train
# (в Google Colab или Kaggle с GPU). Для подготовки данных и тестов они не нужны
train = [
    "albumentations>=2.0",
    "scikit-learn>=1.6",
    "timm>=1.0",
    "torch>=2.6",
    "torchvision>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitiguard_ml"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["vitiguard_ml"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Пакеты из группы train ставятся не всегда, а типов у части из них нет
module = ["torch.*", "timm.*", "albumentations.*", "sklearn.*", "torchvision.*"]
ignore_missing_imports = true
