[project]
name = "vitiguard-ml"
version = "0.1.0"
description = "Обучение и оценка моделей VitiGuard MD: диагностика по фото, прогноз риска, спутниковые аномалии"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=12.0",
    "pydantic>=2.11",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-pyyaml>=6.0",
]
# Тяжёлые зависимости для обучения ставятся отдельно: uv sync --group train
# (в Google Colab или Kaggle с GPU). Для подготовки данных и тестов они не нужны
train = [
    "albumentations>=2.0",
    "grad-cam>=1.5",
    "lightgbm>=4.6",
    "matplotlib>=3.9",
    "onnx>=1.17",
    "opencv-python-headless>=4.10",
    "pandas>=3.0",
    "scikit-learn>=1.6",
    "segmentation-models-pytorch>=0.5",
    "timm>=1.0",
    "torch>=2.6",
    "torchvision>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vitiguard_ml"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["vitiguard_ml"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Пакеты из группы train ставятся не всегда, а типов у части из них нет
module = [
    "torch.*",
    "timm.*",
    "albumentations.*",
    "sklearn.*",
    "torchvision.*",
    "cv2.*",
    "pytorch_grad_cam.*",
    "segmentation_models_pytorch.*",
    "matplotlib.*",
    "lightgbm.*",
    "pandas.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Наследование от Dataset и декоратор torch.no_grad: без установленного torch
# mypy видит их как Any
module = [
    "vitiguard_ml.training",
    "vitiguard_ml.segmentation",
    "vitiguard_ml.explain",
    "vitiguard_ml.experiments",
    "vitiguard_ml.export_server",
    "vitiguard_ml.risk.models",
    "vitiguard_ml.risk.experiment",
]
disallow_subclassing_any = false
disallow_untyped_decorators = false
