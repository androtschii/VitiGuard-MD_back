[project]
name = "vitiguard-backend"
dynamic = ["version"]
description = "Бэкенд VitiGuard MD — мониторинг здоровья виноградников Молдовы"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "geoalchemy2>=0.20.0",
    "httpx2>=2.13.1",
    "minio>=7.2.20",
    "onnxruntime>=1.30",
    "openpyxl>=3.1",
    "pillow>=12.0",
    "prometheus-client>=0.26.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyshp>=3.1.6",
    "python-multipart>=0.0.32",
    "rasterio>=1.5",
    "reportlab>=4.4",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: тесты с PostgreSQL в Docker (Testcontainers)"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["app"]
branch = true
# SQLAlchemy выполняет async-запросы через greenlet, а TestClient запускает приложение
# в отдельном потоке: без greenlet строки после await в этих тестах считаются непокрытыми
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "PT", "ASYNC", "RUF"]
# E501: длину строк контролирует Black; RUF001-003 срабатывают на кириллицу в строках и комментариях
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
strict = true
files = ["app", "migrations", "tests"]
plugins = ["pydantic.mypy"]

# pyshp аннотирован, но не объявляет py.typed
[[tool.mypy.overrides]]
module = "shapefile"
ignore_missing_imports = true

# У onnxruntime, onnx и rasterio нет аннотаций типов
[[tool.mypy.overrides]]
module = ["onnxruntime.*", "onnx.*", "rasterio.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[dependency-groups]
dev = [
    "black>=26.10.0",
    "celery-types>=0.26.0",
    "mypy>=2.4.0",
    "onnx>=1.23",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "testcontainers[postgres]>=4.15.0",
    "types-defusedxml>=0.7.0.20260504",
    "types-docker>=7.2.0.20261006",
    "types-openpyxl>=3.1.5.20261017",
    "types-reportlab>=5.0.0.20261008",
]
